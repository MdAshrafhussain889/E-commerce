services:
  db:
    image: postgres:14-alpine
    container_name: superhardware-db
    environment:
      POSTGRES_USER: superhardware
      POSTGRES_PASSWORD: superhardware
      POSTGRES_DB: superhardware
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superhardware -d superhardware"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
